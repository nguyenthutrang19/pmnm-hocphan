{% extends "base.html" %}

{% block title %}{{ action }} Sách{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h3 class="mb-3">{{ action }} Sách</h3>
        {% if not categories %}
            <div class="alert alert-warning">
                Chưa có danh mục nào. Vui lòng <a href="{{ url_for('book_management.create_category') }}">tạo danh mục</a> trước.
            </div>
        {% else %}
            <form method="post" class="border p-4 rounded">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Danh mục</label>
                    <select name="category_id" class="form-select" required>
                        {% for cat in categories %}
                            <option value="{{ cat.id }}" {% if request.form.get('category_id', default_cat_id|string if default_cat_id else '') == cat.id|string %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tên sách</label>
                    <input type="text" name="title" class="form-control" maxlength="150" required value="{{ request.form.get('title', book.title if book else '') }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Tác giả</label>
                    <input type="text" name="author" class="form-control" maxlength="100" required value="{{ request.form.get('author', book.author if book else '') }}">
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Giá bán (VNĐ)</label>
                    <input type="number" name="price" class="form-control" min="0" step="1000" required value="{{ request.form.get('price', book.price|int if book else 0) }}">
                </div>
                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('book_management.list_books') }}" class="btn btn-secondary">Quay lại</a>
                    <button type="submit" class="btn btn-dark">Lưu</button>
                </div>
            </form>
        {% endif %}
    </div>
</div>
{% endblock %}
