<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máy Tính Mini</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 antialiased">

    <div class="w-full max-w-sm bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
        
        <!-- Header -->
        <div class="text-center">
            <h2 class="text-xl font-bold text-slate-800 tracking-tight">Máy Tính Mini</h2>
            <p class="text-xs text-slate-400 mt-1">Nhập giá trị a và b để tính toán</p>
        </div>
        
        <!-- Form -->
        <form method="POST" class="space-y-4">
            <div>
                <label for="numA" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">Số a</label>
                <input 
                    type="number" 
                    id="numA" 
                    name="a" 
                    placeholder="Ví dụ: 10" 
                    required 
                    step="any"
                    value="{{a}}"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10 transition duration-150"
                >
            </div>

            <div>
                <label for="numB" class="block text-xs font-semibold text-slate-600 mb-1.5 uppercase tracking-wider">Số b</label>
                <input 
                    type="number" 
                    id="numB" 
                    name="b" 
                    placeholder="Ví dụ: 5" 
                    required 
                    step="any"
                    value="{{b}}"
                    class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/10 transition duration-150"
                >
            </div>

            <button 
                type="submit" 
                class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.98] text-white text-sm font-semibold rounded-lg shadow-sm transition duration-150 cursor-pointer"
            >
                OK
            </button>
        </form>

        <!-- Kết quả -->
        <div class="pt-5 border-t border-slate-100 space-y-3" id="resultBox">
            <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Kết quả</h3>
            
            <div class="space-y-2">
                <div class="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm">
                    <span class="text-slate-500 font-medium">Tổng (a + b)</span>
                    <span id="resTong" class="font-semibold text-emerald-600">{{result.tong}}</span> 
                </div>
                
                <div class="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm">
                    <span class="text-slate-500 font-medium">Hiệu (a - b)</span>
                    <span id="resHieu" class="font-semibold text-emerald-600">{{result.hieu}}</span>
                </div>
                
                <div class="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm">
                    <span class="text-slate-500 font-medium">Tích (a × b)</span>
                    <span id="resTich" class="font-semibold text-emerald-600">{{result.tich}}</span>
                </div>
                
                <div class="flex justify-between items-center px-3 py-2 bg-slate-50 rounded-lg text-sm">
                    <span class="text-slate-500 font-medium">Thương (a / b)</span>
                    <span id="resThuong" class="font-semibold text-emerald-600">{{result.thuong}}</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
