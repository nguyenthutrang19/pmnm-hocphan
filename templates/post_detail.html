<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ post.title }} - Blog của tôi</title>
    <!-- Nhúng Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10 shadow-sm">
        <div class="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600 hover:text-indigo-700 transition">
                🚀 MyBlog
            </a>
            <a href="/" class="text-sm font-medium text-gray-600 hover:text-indigo-600 transition flex items-center gap-1">
                ← Quay lại danh sách
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 py-10 flex-grow w-full">
        <article class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 md:p-10">
            
            <!-- Category / Tag Placeholder -->
            <div class="mb-4">
                <span class="inline-block bg-indigo-50 text-indigo-600 text-xs font-semibold px-3 py-1 rounded-full uppercase tracking-wider">
                    Bài viết
                </span>
            </div>

            <!-- Title -->
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-4 leading-tight">
                {{ post.title }}
            </h1>

            <!-- Author & Meta Info -->
            <div class="flex items-center gap-3 pb-6 mb-8 border-b border-gray-100 text-sm text-gray-500">
                <div class="w-10 h-10 rounded-full bg-indigo-500 text-white flex items-center justify-center font-bold text-base shadow-sm">
                    {{ post.author[0] | upper }}
                </div>
                <div>
                    <p class="font-semibold text-gray-800">{{ post.author }}</p>
                    <p class="text-xs text-gray-400">Đăng bởi tác giả • ID: #{{ post.id }}</p>
                </div>
            </div>

            <!-- Article Body -->
            <div class="prose prose-indigo max-w-none text-gray-700 text-lg leading-relaxed whitespace-pre-line">
                {{ post.content }}
            </div>

            <!-- Footer Actions / Share -->
            <div class="mt-10 pt-6 border-t border-gray-100 flex items-center justify-between text-sm text-gray-500">
                <a href="/" class="inline-flex items-center gap-2 font-medium text-indigo-600 hover:text-indigo-700 transition">
                    ← Trở về trang chủ
                </a>
                <button onclick="navigator.clipboard.writeText(window.location.href); alert('Đã sao chép liên kết!');" 
                        class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition font-medium text-xs">
                    🔗 Chia sẻ bài viết
                </button>
            </div>

        </article>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-sm text-gray-400">
        <p>© 2026 MyBlog. Tất cả quyền được bảo lưu.</p>
    </footer>

</body>
</html>
