<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Thư Viện Sách{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between">
    <!-- Menu chung -->
    <nav class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="{{ url_for('baitapchuong3.home') }}" class="font-bold text-lg">📚 ThuVienApp</a>
            <div class="space-x-4">
                <a href="{{ url_for('baitapchuong3.home') }}" class="hover:underline">Trang chủ</a>
                <a href="{{ url_for('baitapchuong3.book_list') }}" class="hover:underline">Danh sách sách</a>
            </div>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-4 py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-gray-200 text-center py-4 text-sm text-gray-600">
        Bài tập Chương 3 - Quản lý thư viện
    </footer>
</body>
</html>
