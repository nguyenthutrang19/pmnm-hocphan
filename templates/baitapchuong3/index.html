{% extends "baitapchuong3/layout.html" %}
{% block title %}Trang Chủ - Thư Viện{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6">Thống kê thư viện</h1>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div class="p-6 bg-blue-50 border border-blue-200 rounded-xl">
        <h2 class="text-gray-600 font-medium">Tổng số đầu sách</h2>
        <p class="text-4xl font-extrabold text-blue-600 mt-2">{{ total_books }}</p>
    </div>
    <div class="p-6 bg-green-50 border border-green-200 rounded-xl">
        <h2 class="text-gray-600 font-medium">Số sách sẵn sàng cho mượn</h2>
        <p class="text-4xl font-extrabold text-green-600 mt-2">{{ available_books }}</p>
    </div>
</div>
<div class="mt-6">
    <a href="{{ url_for('baitapchuong3.book_list') }}" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700">Xem danh sách sách →</a>
</div>
{% endblock %}
